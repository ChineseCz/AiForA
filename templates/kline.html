<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} 日线 · 雪球大V看板</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div class="kline-page">
  <header class="kline-top">
    <a href="/" class="kline-back">← 返回选股</a>
    <div class="kline-title">
      <h1 id="klineTitle">{{ code }}</h1>
      <p class="sub" id="klineSub">加载中…</p>
    </div>
  </header>
  <div class="panel kline-basic">
    <div class="table-scroll">
      <table class="basic-table">
        <thead>
          <tr>
            <th>日期</th><th>开盘</th><th>收盘</th><th>涨跌幅</th><th>最高</th><th>最低</th>
            <th>成交量</th><th>MA5</th><th>MA10</th><th>MA20</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="bDate">—</td><td id="bOpen">—</td><td id="bClose">—</td><td id="bPct">—</td>
            <td id="bHigh">—</td><td id="bLow">—</td><td id="bVol">—</td>
            <td id="bMa5">—</td><td id="bMa10">—</td><td id="bMa20">—</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="panel kline-panel">
    <div class="kline-chart-wrap">
      <div id="klineChart" class="kline-chart"></div>
      <div class="kline-overlay ov-vol" id="ovVol"></div>
      <div class="kline-overlay ov-macd" id="ovMacd"></div>
      <div class="kline-overlay ov-kdj" id="ovKdj"></div>
      <div class="kline-overlay ov-signal" id="ovSignal"></div>
      <div class="kline-overlay ov-sell" id="ovSell"></div>
    </div>
  </div>
  <div class="panel kline-funda" id="klineFunda">
    <div class="panel-head"><h3>基本面</h3><span class="muted" id="fundaStatus">加载中…</span></div>
    <div class="funda-grid">
      <div class="funda-col">
        <h4>财务指标</h4>
        <div id="fundaFinance" class="funda-finance"></div>
      </div>
      <div class="funda-col">
        <h4>所属板块</h4>
        <div id="fundaSectors" class="funda-tags"></div>
      </div>
    </div>
    <div class="funda-mentions">
      <h4>大V提及（近90天）</h4>
      <div id="fundaMentions" class="post-list"></div>
    </div>
    <div class="funda-mentions funda-news">
      <h4>相关新闻（近14天）</h4>
      <div id="fundaNews" class="post-list"><p class="muted funda-empty">加载中…</p></div>
    </div>
  </div>
</div>
<script>window.STOCK_CODE = {{ code|tojson }};</script>
<script src="/static/js/kline.js"></script>
</body>
</html>
