<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>雪球大V看板 · A股选股</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1668dc" />

    <!-- iOS "添加到主屏幕" 全屏体验（iOS Safari 不认 manifest.json） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="雪球看板" />
    <style>
      /* 首屏启动层内联，保证 React/业务 JS 尚未加载时也不会出现白屏。 */
      #startup-splash {
        position: fixed; inset: 0; z-index: 9999; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #e8eef8; background: #101418;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        transition: opacity .28s ease, visibility .28s ease;
      }
      #startup-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #startup-splash img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 8px 28px rgba(22,104,220,.32); }
      #startup-splash .splash-name { font-size: 22px; font-weight: 650; letter-spacing: 2px; }
      #startup-splash .splash-subtitle { margin-top: -12px; color: #8f9baa; font-size: 12px; letter-spacing: 1px; }
      #startup-splash .splash-loader { width: 34px; height: 3px; overflow: hidden; border-radius: 3px; background: #27313d; }
      #startup-splash .splash-loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #4b9eff; animation: splash-loading 1.1s ease-in-out infinite; }
      @keyframes splash-loading { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <div id="startup-splash" aria-label="正在加载雪球看板">
      <img src="/icons/icon-192.png" alt="雪球看板" />
      <div class="splash-name">雪球看板</div>
      <div class="splash-subtitle">XUEQIU INSIGHT</div>
      <div class="splash-loader" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
