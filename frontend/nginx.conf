server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：非静态资源一律回 index.html（React Router 前端路由）
    # index.html 引用的是带 hash 的资源文件名，必须禁止浏览器缓存，否则改版后浏览器可能
    # 一直用本地缓存的旧 index.html（指向已不存在/已过期的旧资源），看不到新版本。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 反代后端 API（同源，避免前端配 CORS / 暴露 API 端口）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health {
        proxy_pass http://api:8000;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
