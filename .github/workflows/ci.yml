name: CI

on:
  push:
    branches: [main, master, release_v1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app || true   # 首轮不阻断，后续可去掉 || true
      - name: Import check (app + celery tasks)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://natapp:natapp@localhost:5432/natapp
          REDIS_URL: redis://localhost:6379/0
        run: python -c "import app.main; import app.workers.celery_app; print('import ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t natapp-backend ./backend
      - name: Build frontend image
        run: docker build -t natapp-frontend ./frontend
